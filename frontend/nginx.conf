# [Nginx] 프론트 정적 파일 서빙 + 백엔드 프록시 설정.
# 기존 vite.config.ts의 server.proxy(/api → localhost:8000)가 로컬 개발에서 하던 역할을
# 컨테이너 환경에서 이어받는다. 브라우저 입장에서 프론트·백엔드가 항상 같은 오리진으로
# 보이므로 CORS 설정이 필요 없다 (client.ts의 API_BASE가 빈 문자열이라 상대경로로 호출됨).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: 존재하지 않는 경로는 전부 index.html로 넘겨 React Router가 새로고침에도 깨지지 않게 한다.
    location / {
        try_files $uri /index.html;
    }
}
